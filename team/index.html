<!DOCTYPE html>
<html lang="en-NZ">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Meet the Dream Team at Dream Property: Calix Mojica, Rae Lillo, and Monica Lillo.">
  <meta name="theme-color" content="#040B15">
  <title>Dream Team | Dream Property</title>
  <link rel="canonical" href="https://www.dreamproperty.co.nz/team">
  <link rel="icon" type="image/png" sizes="32x32" href="/images/favicon.png">
  <style>
    :root {
      --navy: #040B15; --navy-light: #0A1422; --gold: #D6B878; --white: #FFFFFF;
      --muted: #AAB4C2; --border: rgba(255, 255, 255, 0.14); --radius: 28px; --radius-sm: 16px; --transition: 300ms ease;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--navy); color: var(--white);
      font-family: -apple-system, BlinkMacSystemFont, system-ui, "SF Pro Text", "Helvetica Neue", "Segoe UI", Roboto, Arial, sans-serif;
      line-height: 1.6; -webkit-font-smoothing: antialiased;
    }
    a { color: inherit; text-decoration: none; }
    img { display: block; max-width: 100%; }
    .container { width: min(1100px, calc(100% - 40px)); margin: 0 auto; }
    .site-header {
      position: sticky; top: 0; z-index: 50;
      background: rgba(4, 11, 21, 0.92); backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border);
    }
    .header-inner {
      min-height: 80px; display: flex; align-items: center; justify-content: space-between; gap: 20px;
      width: min(1180px, calc(100% - 40px)); margin: 0 auto;
    }
    .brand { display: inline-flex; align-items: center; gap: 12px; }
    .brand-logo { width: 40px; height: 40px; object-fit: contain; }
    .brand-name { font-size: 1.2rem; font-weight: 600; letter-spacing: -0.03em; }
    .brand-name span { color: var(--gold); }
    .nav-links { display: flex; gap: 18px; }
    .nav-links a { color: var(--muted); font-size: 0.78rem; font-weight: 600; }
    .nav-links a:hover { color: var(--gold); }
    main { padding: 80px 0 100px; }
    .eyebrow { color: var(--gold); font-size: 0.76rem; font-weight: 700; letter-spacing: 0.22em; text-transform: uppercase; margin-bottom: 14px; }
    h1 { font-size: clamp(2.4rem, 5vw, 3.8rem); font-weight: 500; letter-spacing: -0.035em; margin-bottom: 16px; }
    h1 span { color: var(--gold); }
    .intro { color: var(--muted); font-size: 1.05rem; line-height: 1.75; max-width: 640px; margin-bottom: 48px; }
    .team-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 20px; }
    .team-card {
      display: flex; flex-direction: column; overflow: hidden; border: 1px solid var(--border);
      border-radius: var(--radius); background: rgba(16, 29, 45, 0.55);
      transition: transform var(--transition), border-color var(--transition);
    }
    .team-card:hover { transform: translateY(-4px); border-color: rgba(255, 255, 255, 0.22); }
    .team-image { aspect-ratio: 4 / 4.5; overflow: hidden; background: var(--navy-light); }
    .team-image img { width: 100%; height: 100%; object-fit: cover; }
    .team-placeholder {
      width: 100%; height: 100%; display: flex; align-items: center; justify-content: center;
      color: var(--muted); font-size: 0.72rem; font-weight: 700; letter-spacing: 0.12em;
      text-transform: uppercase; text-align: center; padding: 20px;
      background: linear-gradient(145deg, rgba(255, 255, 255, 0.06), rgba(4, 11, 21, 0.72));
    }
    .team-body { padding: 24px 22px 26px; display: flex; flex-direction: column; flex: 1; }
    .team-role { color: var(--gold); font-size: 0.64rem; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; }
    .team-body h2 { margin-top: 8px; margin-bottom: 18px; font-size: 1.45rem; font-weight: 500; letter-spacing: -0.02em; }
    .button {
      margin-top: auto; min-height: 42px; display: inline-flex; align-items: center; justify-content: center;
      padding: 0 18px; border-radius: var(--radius-sm); font-size: 0.72rem; font-weight: 700;
      letter-spacing: 0.06em; text-transform: uppercase; border: 1px solid rgba(255, 255, 255, 0.35); color: var(--white);
    }
    .button:hover { border-color: var(--gold); color: var(--gold); }
    .site-footer { padding: 28px 0; border-top: 1px solid rgba(255, 255, 255, 0.07); background: #02070E; text-align: center; color: var(--muted); font-size: 0.72rem; }
    @media (max-width: 900px) { .team-grid { grid-template-columns: 1fr; max-width: 420px; } }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <a class="brand" href="/" aria-label="Dream Property home">
        <img class="brand-logo" src="/dream-property-logo.svg" alt="Dream Property logo">
        <div class="brand-name">Dream <span>Property</span></div>
      </a>
      <nav class="nav-links">
        <a href="/">Home</a>
        <a href="/about">About</a>
        <a href="/contact">Contact</a>
      </nav>
    </div>
  </header>
  <main>
    <div class="container">
      <div class="eyebrow">Executives</div>
      <h1>The <span>Dream Team</span></h1>
      <p class="intro">The founding team behind Dream Property.</p>
      <div class="team-grid">
        <article class="team-card">
          <a href="/team/calixmojica" class="team-image" aria-label="View Calix Mojica profile">
            <img src="/images/calix-mojica.jpg" alt="Calix Mojica" loading="lazy">
          </a>
          <div class="team-body">
            <div class="team-role">CEO | Co-Founder</div>
            <h2>Calix Mojica</h2>
            <a class="button" href="/team/calixmojica">View profile</a>
          </div>
        </article>
        <article class="team-card">
          <a href="/team/raelillo" class="team-image" aria-label="View Rae Lillo profile">
            <img src="/images/rae-lillo.jpg" alt="Rae Lillo" loading="lazy">
          </a>
          <div class="team-body">
            <div class="team-role">CPO | Co-Founder</div>
            <h2>Rae Lillo</h2>
            <a class="button" href="/team/raelillo">View profile</a>
          </div>
        </article>
        <article class="team-card">
          <a href="/team/monicalillo" class="team-image" aria-label="View Monica Lillo profile">
            <div class="team-placeholder">Photo coming soon</div>
          </a>
          <div class="team-body">
            <div class="team-role">CTO | Associate Software Developer</div>
            <h2>Monica Lillo</h2>
            <a class="button" href="/team/monicalillo">View profile</a>
          </div>
        </article>
      </div>
    </div>
  </main>
  <footer class="site-footer">
    <div class="container"><p>© <span id="y"></span> Dream Property</p></div>
  </footer>
  <script>document.getElementById("y").textContent = String(new Date().getFullYear());</script>
</body>
</html>
